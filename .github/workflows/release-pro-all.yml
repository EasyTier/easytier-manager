name: Release Pro ALL

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 发布版本号（如 3.5.0），留空则不在本步创建 tag，草稿发布后手动指定
        required: false
        default: ''

permissions: write-all
env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  # Windows 构建（NSIS / MSI / 便携版 zip）
  build-windows:
    if: contains('["xlc520"]', github.actor)
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 安装 Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 缓存 Rust 构建产物，加速二次构建
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 安装依赖
      - name: Install dependencies
        run: pnpm i

      # 打包
      - name: Build application
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: pnpm tauri:build

      # 打包成zip文件
      - name: Create zip package
        run: |
          mkdir release-package
          xcopy src-tauri\target\release\*.exe release-package\ /Y
          xcopy src-tauri\target\release\resource\* release-package\resource\ /E /I /Y
          powershell Compress-Archive -Path release-package\* -DestinationPath easytier-manager-pro.zip

      # 上传便携版zip包
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: easytier-manager-pro-portable
          path: easytier-manager-pro.zip

      # 上传 NSIS 安装包
      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: easytier-manager-pro-setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      # 上传 MSI 安装包
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: easytier-manager-pro-msi
          path: src-tauri/target/release/bundle/msi/*.msi

  # macOS 构建（Apple Silicon DMG，ad-hoc 签名）
  build-macos:
    if: contains('["xlc520"]', github.actor)
    permissions:
      contents: write
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm ts:check

      - name: Build application bundle
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app

      # Ad-hoc 签名并打包 DMG（无 Apple Developer ID，适合开发/本地分发验证）
      - name: Ad-hoc sign and package DMG
        shell: bash
        run: |
          set -euo pipefail
          app_path=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app_path"
          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          dmg_root="$RUNNER_TEMP/easytier-manager-dmg"
          dmg_path="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/easytier-manager-pro-aarch64.dmg"
          mkdir -p "$dmg_root" "$(dirname "$dmg_path")"
          cp -R "$app_path" "$dmg_root/"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create -volname "EasyTier Manager Pro" -srcfolder "$dmg_root" -ov -format UDZO "$dmg_path"

      # 校验打包后的 DMG：签名有效且为 arm64 架构
      - name: Verify packaged DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg_path=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          mount_point="$RUNNER_TEMP/easytier-manager-mounted"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point"' EXIT
          app_path=$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          file "$app_path/Contents/MacOS/easytier-manager-pro" | grep -q 'arm64'
          hdiutil detach "$mount_point"
          trap - EXIT

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: easytier-manager-pro-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  # 汇总所有平台产物，发布到同一个草稿 Release
  release:
    if: contains('["xlc520"]', github.actor)
    needs: [build-windows, build-macos]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      # 下载所有平台构建产物，每个 artifact 解压到以其名称命名的子目录
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      # 发布草稿 Release，包含 Windows 与 macOS 全部产物
      # tag 由触发时手动指定；留空则发布无 tag 草稿，后续在草稿中补填 tag 再发布
      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          tag_name: ${{ github.event.inputs.tag_name && format('v{0}', github.event.inputs.tag_name) || '' }}
          generate_release_notes: true
          files: |
            artifacts/easytier-manager-pro-portable/*.zip
            artifacts/easytier-manager-pro-setup/*.exe
            artifacts/easytier-manager-pro-msi/*.msi
            artifacts/easytier-manager-pro-macos-arm64/*.dmg
